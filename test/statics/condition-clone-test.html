<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>condition clone test</title>
    <script src="../../dist/xhear.js"></script>
  </head>
  <body>
    <cond-comp></cond-comp>

    <script type="module">
      window.condReady = 0;

      $.register({
        tag: "cond-comp",
        temp: `
          <style>:host { display: block; }</style>
          <button class="toggle" on:click="count++">TOGGLE</button>
          <x-if :value="count % 2 === 0">
            <span class="even">even {{count}}</span>
          </x-if>
          <x-else>
            <span class="odd">odd {{count}}</span>
          </x-else>
        `,
        data: {
          count: 0,
        },
        ready() {
          window.condReady++;
        },
      });
    </script>
  </body>
</html>
